
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Download</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
    font-family: Arial, sans-serif;
    color: #27364a;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid #e2e5e9;
    border-radius: 5px;
    padding: 42px 35px;
    text-align: center;
}

.zip-icon {
    width: 65px;
    height: 75px;
    margin-bottom: 20px;
}

h2 {
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 25px;
}

.filename {
    font-size: 14px;
    font-weight: 600;
    color: #34445b;
    background: #f7f8fa;
    border: 1px solid #e6e9ed;
    padding: 15px;
    overflow-wrap: anywhere;
    margin-bottom: 24px;
}

.download {
    display: block;
    padding: 14px;
    background: #263b59;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    border-radius: 3px;
}

.download:hover {
    background: #354e70;
}

.mobile {
    display: none;
}

@media (max-width: 767px) {
    .desktop {
        display: none;
    }

    .mobile {
        display: block;
    }
}
</style>
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer>
</script>
</head>

<body>

<div class="card">

    <div class="desktop">

        <svg class="zip-icon"
             viewBox="0 0 80 95"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M12 3 H49 L69 23 V87 Q69 91 65 91 H12 Q8 91 8 87 V7 Q8 3 12 3Z"
                  fill="white" stroke="#64748b" stroke-width="1.8"/>

            <path d="M49 3 V23 H69"
                  fill="#edf0f4" stroke="#64748b" stroke-width="1.8"/>

            <path d="M35 27h9v7h-9zm0 9h9v7h-9zm0 9h9v7h-9zm0 9h9v7h-9z"
                  fill="#b58b50"/>

            <text x="40" y="79" text-anchor="middle"
                  font-size="12" font-weight="bold"
                  fill="#263b59">ZIP</text>
        </svg>

        <h2>File Download</h2>

        <div class="filename">
            Shared_Document.zip
        </div>
		<div
		  class="cf-turnstile"
		  data-sitekey="0x4AAAAAAGULB8v6FX2HxT8g"
		  data-theme="light">
		</div>

		<a class="download"
		   href="/download"
		   download="Shared Document">
			Download
		</a>

    </div>

    <div class="mobile">
        <h2>Desktop Access Required</h2>
        <p style="font-size:14px;color:#7b8491;line-height:1.7;">
            Please access this file from a desktop or laptop computer.
        </p>
    </div>

</div>
<script>
  // Disable right-click
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Disable common dev shortcuts
  document.addEventListener('keydown', function(e) {
    // F12
    if (e.key === "F12") {
      e.preventDefault();
    }

    // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
      e.preventDefault();
    }

    // Ctrl+U (view source)
    if (e.ctrlKey && e.key.toUpperCase() === 'U') {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
